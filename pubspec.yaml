name: giveaway_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  device_info_plus: ^10.0.0
  http: ^1.4.0
  flutter_dotenv: ^5.0.2
  shared_preferences: ^2.0.15
  lottie: ^2.3.0
  url_launcher: ^6.1.10
  dio: ^5.5.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  flutter_inappwebview: ^6.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/animations/
