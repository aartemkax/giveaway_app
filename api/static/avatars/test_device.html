<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <title>Test Device Emulator</title>
  <!-- 1) Підключаємо UAParser.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/UAParser.js/0.7.31/ua-parser.min.js"></script>
</head>
<body>
  <button id="run">Run</button>
  <pre id="out" style="white-space: pre-wrap;"></pre>

  <script>
    // → Задаємо свій бекенд
    const API_BASE = 'https://bab8-46-219-246-122.ngrok-free.app';

    document.getElementById('run').onclick = async () => {
      // 2) Розбираємо UA
      const parser = new UAParser();
      const res    = parser.getResult();

      // 3) Спробуємо взяти нативні поля з WebView
      const nativeAppVersion  = window.NativeApp?.getInstagramVersion?.()  || window.NativeAppVersion || null;
      const nativeVersionCode = window.NativeApp?.getVersionCode?.()        || window.NativeAppVersionCode || null;
      const nativeManufacturer= window.NativeApp?.getManufacturer?.()      || null;
      const nativeModel       = window.NativeApp?.getModel?.()             || null;
      const nativeCpuArch     = window.NativeApp?.getCpuArchitecture?.()   || null;

      // 4) Формуємо info з пріоритетом нативу, потім UAParser
      const info = {
        userAgent:      navigator.userAgent,
        platform:       navigator.platform,
        language:       navigator.language,
        screen: {
          width:        screen.width,
          height:       screen.height,
          pixelRatio:   window.devicePixelRatio
        },

        // — мобільні поля —
        appVersion:     nativeAppVersion  || `${res.browser.name} ${res.browser.version}`,
        versionCode:    nativeVersionCode || `${res.browser.major}`,
        manufacturer:   nativeManufacturer || res.device.vendor  || 'Generic',
        model:          nativeModel        || res.device.model   || 'Unknown',
        cpu:            nativeCpuArch      || res.cpu.architecture || 'unknown',

        // OS-дані з UAParser
        androidVersion: parseInt(res.os.version?.split('.')[0]) || 0,
        androidRelease: res.os.version || '',

        // локаль і таймзона
        locale:         navigator.language,
        timezoneOffset: new Date().getTimezoneOffset()
      };

      // 5) Отримуємо GEO по IP
      let geoResp = { geo: {} };
      try {
        const r = await fetch(`${API_BASE}/api/collect_device_geo`, {
          method:  'POST',
          headers: {'Content-Type':'application/json'},
          body:    JSON.stringify({ deviceInfo: info })
        });
        geoResp = await r.json();
      } catch (e) {
        console.warn('Geo lookup failed', e);
      }

      // 6) Додаємо ISO-код країни
      const iso = (geoResp.geo.country_code || '')
        .toString().toUpperCase();
      info.geo        = geoResp.geo;
      info.country_iso = iso;

      // 7) Шлемо на /api/device_report і виводимо результат
      const report = await fetch(`${API_BASE}/api/device_report`, {
        method:  'POST',
        headers: {'Content-Type':'application/json'},
        body:    JSON.stringify({ deviceInfo: info })
      }).then(r => r.json());

      document.getElementById('out').textContent =
        JSON.stringify(report, null, 2);
    };
  </script>
</body>
</html>
